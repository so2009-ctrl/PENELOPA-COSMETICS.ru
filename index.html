function renderCart(){const rows=Object.keys(cart).map(id=>({p:products.find(x=>x.id===id),n:cart[id],id})).filter(r=>r.p);
$("#badge").textContent=rows.reduce((s,r)=>s+r.n,0);const sum=rows.reduce((s,r)=>s+r.n*r.p.price,0);$("#tot").textContent=money(sum);
$("#items").innerHTML=rows.length?rows.map(r=>`<div class="flex gap-3 items-center fi"><img src="${esc(r.p.image)}" class="w-16 h-16 rounded object-cover"><div class="flex-1"><p class="font-medium text-sm">${esc(r.p.title)}</p><p class="text-rose-deep text-sm">${money(r.p.price)}</p></div><div class="flex items-center gap-2"><button data-d="${r.id}" class="w-7 h-7 rounded bg-rose-soft">−</button><b>${r.n}</b><button data-u="${r.id}" class="w-7 h-7 rounded bg-rose-soft">+</button></div></div>`).join(""):`<div class="text-center text-stone-400 mt-10 flex flex-col items-center gap-2">${BAG}<p>${t("empty")}</p></div>`;
$("#items").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=b.dataset.d;if(--cart[i]<=0)delete cart[i];saveCart();renderCart()});
$("#items").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{cart[b.dataset.u]++;saveCart();renderCart()});
$("#co").disabled=!rows.length;$("#co").style.opacity=rows.length?1:.5}
const drawer=o=>{$("#drawer").classList.toggle("translate-x-full",!o);$("#ov").classList.toggle("hidden",!o)};
$("#cartBtn").onclick=()=>drawer(true);$("#cx").onclick=$("#ov").onclick=()=>drawer(false);
$("#co").onclick=()=>{drawer(false);modal(`<div class="p-6 relative"><button id="mx" class="absolute top-3 right-4 text-2xl">✕</button><h2 class="font-head text-3xl text-rose-deep mb-4">${t("checkout")}</h2><div class="space-y-3"><input id="cn" class="inp" placeholder="${t("name")}"><div class="flex"><span class="inp !w-auto !border-r-0 bg-rose-soft font-semibold flex items-center">+992</span><input id="cp" class="inp" type="tel" inputmode="numeric" maxlength="9" placeholder="900000000" autocomplete="tel-national" aria-label="${t("phone")}"></div><textarea id="ca" class="inp" rows="2" placeholder="${t("address")}"></textarea><div class="flex items-center gap-2"><button id="gl" type="button" class="btn !py-1 text-sm">${t("findAddr")}</button><span id="gst" class="text-xs text-stone-500"></span></div><select id="cm" class="inp"><option value="COD">${t("cod")}</option><option value="Card">${t("card")}</option></select><p class="font-semibold">${t("total")}: ${$("#tot").textContent}</p><button id="po" class="btn w-full">${t("place")}</button></div></div>`);
$("#mx").onclick=closeModal;let geo=null;
const locate=()=>{const st=$("#gst");if(!navigator.geolocation){st.textContent=t("locFail");return}st.textContent=t("locating");
navigator.geolocation.getCurrentPosition(async pos=>{const la=pos.coords.latitude,lo=pos.coords.longitude;geo={lat:la,lon:lo};let a=la.toFixed(5)+", "+lo.toFixed(5);
try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&accept-language=${["en","ru","tg"][LI]}`);const j=await r.json();if(j.display_name)a=j.display_name}catch(e){}
$("#ca").value=a;st.textContent="✔"},()=>{st.textContent=t("locFail")},{enableHighAccuracy:true,timeout:15000})};
$("#gl").onclick=locate;locate();
$("#cp").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,9)};$("#cp").onpaste=e=>{e.preventDefault();let d=(e.clipboardData.getData("text")||"").replace(/\D/g,"");if(d.startsWith("992")&&d.length>=12)d=d.slice(3);e.target.value=d.slice(0,9)};
$("#po").onclick=async()=>{const name=$("#cn").value.trim(),digits=$("#cp").value,phone="+992"+digits,address=$("#ca").value.trim();if(!name||!address)return toast(t("fill"));if(!/^\d{9}$/.test(digits))return toast(t("badPhone"));
const items=Object.keys(cart).map(id=>{const p=products.find(x=>x.id===id);return p&&{id,title:p.title,price:p.price,qty:cart[id]}}).filter(Boolean);
try{await B.addOrder({name,phone,address,...(geo?{lat:geo.lat,lon:geo.lon}:{}),payment:$("#cm").value,items,total:items.reduce((s,i)=>s+i.price*i.qty,0)});cart={};saveCart();renderCart();closeModal();toast(t("thanks"),true)}catch(e){console.error(e);toast("Error: "+e.message)}}};

/* ============ ADMIN ============ */
$("#adminBtn").onclick=()=>{if(admin)return renderAdmin();modal(`<div class="p-6 relative"><button id="mx" class="absolute top-3 right-4 text-2xl">✕</button><h2 class="font-head text-3xl text-rose-deep mb-4">${t("admin")}</h2><input id="pw" type="password" class="inp mb-3" placeholder="${t("pwd")}"><button id="lg" class="btn w-full">${t("login")}</button></div>`);
$("#mx").onclick=closeModal;const go=()=>{if($("#pw").value!==ADMIN_PASS)return toast(t("wrong"));admin=true;B.orders(onOrders);renderAdmin()};$("#lg").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}};
function onOrders(list){const fresh=list.filter(o=>!seen.has(o.id));list.forEach(o=>seen.add(o.id));orders=list;
if(!firstOrders&&fresh.length){beep();fresh.forEach(o=>toast(`🔔 ${t("newo")} ${o.name} · ${money(o.total)}`))}firstOrders=false;
if(!$("#modal").classList.contains("hidden")&&$("#ordBox"))renderOrders()}
let editing=null;
function renderAdmin(){curImg="";editing=null;modal(`<div class="p-5 relative"><button id="mx" class="absolute top-3 right-4 text-2xl">✕</button><h2 class="font-head text-3xl text-rose-deep mb-1">${t("admin")} <small class="text-xs text-gold font-body">(${B.mode})</small></h2><button id="gs" class="btn !py-1 text-sm mb-2">⚙ ${t("settings")}</button>
<div class="grid grid-cols-2 gap-3 my-4"><div class="bg-blush rounded p-3 text-center"><p class="text-xs">${t("orders")}</p><b id="sO" class="text-2xl text-rose-deep pl inline-block rounded px-3"></b></div><div class="bg-blush rounded p-3 text-center"><p class="text-xs">${t("revenue")}</p><b id="sR" class="text-2xl text-rose-deep"></b></div></div>
<div class="flex justify-between items-center mb-2 gap-2"><h3 class="font-semibold">${t("orders")}</h3><select id="of" class="inp !w-auto !py-1">${["all","New","Pending","Completed"].map(s=>`<option value="${s}" ${ordF===s?"selected":""}>${t(s)}</option>`).join("")}</select></div><div id="ordBox" class="space-y-3 max-h-72 overflow-auto mb-6"></div>
<h3 class="font-semibold mb-2">${t("addP")}</h3><div class="grid md:grid-cols-2 gap-2"><input id="pt" class="inp" placeholder="${t("title")}"><input id="pr" type="number" step="0.01" class="inp" placeholder="${t("price")}"><select id="pc" class="inp">${CATS.map(c=>`<option value="${c}">${t(c)}</option>`).join("")}</select><div class="md:col-span-2 flex items-center gap-3"><img id="pv" class="w-16 h-16 object-cover border border-rose-soft hidden"><label class="btn !bg-white !text-rose-deep border border-rose-soft cursor-pointer text-center">📷 ${t("pick")}<input id="pf" type="file" accept="image/*" class="hidden"></label></div><textarea id="pd" class="inp md:col-span-2" rows="2" placeholder="${t("desc")}"></textarea></div><button id="ps" class="btn mt-3">${t("save")}</button>
<div id="pList" class="mt-4 space-y-2 max-h-60 overflow-auto"></div></div>`);
$("#mx").onclick=closeModal;renderOrders();renderPList();$("#gs").onclick=renderSettings;$("#of").onchange=e=>{ordF=e.target.value;renderOrders()};$("#pf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{curImg=await shrink(f,700,"image/jpeg");$("#pv").src=curImg;$("#pv").classList.remove("hidden")}catch(x){toast("Image error")}};
$("#ps").onclick=async()=>{const p={title:$("#pt").value.trim(),price:+$("#pr").value,category:$("#pc").value,image:curImg||ph("💖","#fbd5de","#e8869f"),description:$("#pd").value.trim(),stock:editing?(products.find(x=>x.id===editing)||{}).stock!==false:true};if(!p.title||!(p.price>0))return toast(t("fill"));if(editing)p.id=editing;editing=null;await B.saveProduct(p);toast("✔ "+t("save"),true);renderAdmin()}}
function renderOrders(){$("#sO").textContent=orders.length;$("#sR").textContent=money(orders.reduce((s,o)=>s+(+o.total||0),0));
const L2=orders.filter(o=>ordF==="all"||o.status===ordF);$("#ordBox").innerHTML=L2.length?L2.map(o=>`<div class="border border-rose-soft rounded p-3 text-sm ${o.status==="New"?"bg-rose-soft/40":""}"><div class="flex justify-between gap-2 flex-wrap"><b>#${esc(String(o.id).slice(-5))} ${esc(o.name)} · <a href="tel:${esc(o.phone)}" class="text-rose-deep underline">${esc(o.phone)}</a></b><span class="text-xs text-stone-500">${new Date(o.ts).toLocaleString()}</span></div><p>📍 ${esc(o.address)} · ${esc(o.payment)}${o.lat?` · <a class="text-rose-deep underline" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${o.lat}&mlon=${o.lon}#map=17/${o.lat}/${o.lon}">🗺 ${t("map")}</a>`:""}</p><p class="text-stone-600">${o.items.map(i=>`${esc(i.title)} ×${i.qty}`).join(", ")}</p><div class="flex justify-between items-center mt-2"><b class="text-rose-deep">${money(o.total)}</b><select data-s="${o.id}" class="inp !w-auto !py-1">${["New","Pending","Completed"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${t(s)}</option>`).join("")}</select><button data-r="${o.id}" class="text-xs text-red-500 ml-2" aria-label="delete">🗑</button></div></div>`).join(""):`<p class="text-stone-400">${t("none")}</p>`;
$("#ordBox").querySelectorAll("[data-s]").forEach(s=>s.onchange=()=>B.setStatus(s.dataset.s,s.value));$("#ordBox").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(confirm(t("sure")))B.delOrder(b.dataset.r)})}
function renderPList(){$("#pList").innerHTML=products.map(p=>`<div class="flex items-center gap-3 bg-blush rounded p-2"><img src="${esc(p.image)}" class="w-10 h-10 rounded object-cover"><span class="flex-1 text-sm">${esc(p.title)} · ${money(p.price)}</span><button data-k="${p.id}" class="text-xs ${p.stock===false?"text-stone-400":"text-green-600"}">${p.stock===false?t("sold"):t("stock")}</button><button data-e="${p.id}" class="text-xs text-rose-deep">${t("edit")}</button><button data-x="${p.id}" class="text-xs text-red-500">${t("del")}</button></div>`).join("");
$("#pList").querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{await B.delProduct(b.dataset.x);toast("🗑️")});
$("#pList").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.k);B.saveProduct({...p,stock:p.stock===false})});$("#pList").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.e);editing=p.id;$("#pt").value=p.title;$("#pr").value=p.price;$("#pc").value=p.category;curImg=p.image;$("#pv").src=curImg;$("#pv").classList.remove("hidden");$("#pd").value=p.description;$("#pt").focus()})}

/* ============ SETTINGS, IMAGES, SORT ============ */
const BAG='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="text-rose-deep"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
const shrink=(file,max,mime)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext("2d");if(mime==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL(mime,.8))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
const logo=c=>{const n=(S.name||"PENELOPA COSMETICS").split(" "),h=logo0(c).replace("PENELOPA",()=>esc(n[0])).replace("COSMETICS",()=>esc(n.slice(1).join(" ")));return S.logo?h.replace(/<svg.*?<\/svg>/,()=>`<img src="${S.logo}" class="h-9 w-9 object-contain" alt="">`):h};
function applySettings(){document.documentElement.style.setProperty("--deep",S.color||"#b83b63");$("#logo1").innerHTML=logo(1);$("#logo2").innerHTML=logo(2);
$("#cartIc").innerHTML=S.cartIcon?`<img src="${S.cartIcon}" class="w-8 h-8 object-contain" alt="">`:BAG;
$("#home").style.background=S.hero?`linear-gradient(rgba(255,245,247,.8),rgba(255,245,247,.8)),url("${S.hero}") center/cover`:"";
document.title=S.name||"PENELOPA COSMETICS";const f=document.querySelector("[data-i=contactT]");if(f&&S.contact)f.textContent=S.contact}
function renderSort(){$("#sort").innerHTML=[["new","sNew"],["low","sLow"],["high","sHigh"]].map(([v,k])=>`<option value="${v}" ${sortBy===v?"selected":""}>${t(k)}</option>`).join("")}
$("#sort").onchange=e=>{sortBy=e.target.value;renderGrid()};
function renderSettings(){const ns={};const row=(k,l)=>`<label class="block text-sm mt-3">${l}<input id="s_${k}" class="inp mt-1" value="${esc(S[k]||"")}"></label>`;
const img=(k,l)=>`<div class="mt-3 text-sm">${l}<div class="flex items-center gap-3 mt-1"><img id="v_${k}" src="${S[k]||""}" class="w-14 h-14 object-contain border border-rose-soft ${S[k]?"":"hidden"}"><label class="btn !bg-white !text-rose-deep border border-rose-soft cursor-pointer">📷 ${t("pick")}<input id="f_${k}" type="file" accept="image/*" class="hidden"></label><button data-c="${k}" class="text-xs text-red-500">${t("del")}</button></div></div>`;
modal(`<div class="p-5 relative"><button id="mx" class="absolute top-3 right-4 text-2xl">✕</button><h2 class="font-head text-3xl text-rose-deep">⚙ ${t("settings")}</h2>${row("name",t("sname"))}${row("contact",t("scontact"))}${row("cur",t("scur"))}<label class="block text-sm mt-3">${t("scolor")}<input id="s_color" type="color" class="mt-1 block w-16 h-10" value="${S.color||"#b83b63"}"></label>${img("logo",t("slogo"))}${img("hero",t("shero"))}${img("cartIcon",t("scart"))}<div class="flex gap-2 mt-5"><button id="ss" class="btn">${t("save")}</button><button id="sb" class="btn !bg-white !text-rose-deep border border-rose-soft">←</button></div></div>`);
$("#mx").onclick=closeModal;$("#sb").onclick=renderAdmin;
["logo","hero","cartIcon"].forEach(k=>$("#f_"+k).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{ns[k]=await shrink(f,k==="hero"?1400:300,k==="hero"?"image/jpeg":"image/png");$("#v_"+k).src=ns[k];$("#v_"+k).classList.remove("hidden")}catch(x){toast("Image error")}});
$("#mc").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ns[b.dataset.c]="";$("#v_"+b.dataset.c).classList.add("hidden")});
$("#ss").onclick=async()=>{try{await B.saveSettings({name:$("#s_name").value.trim(),contact:$("#s_contact").value.trim(),cur:$("#s_cur").value.trim(),color:$("#s_color").value,...ns});toast("✔ "+t("save"),true);renderAdmin()}catch(e){toast("Error: "+e.message)}}}

/* ============ BOOT ============ */
$("#lang").onchange=e=>{LI=+e.target.value;try{localStorage.setItem("pl",LI)}catch(x){}applyLang()};
$("#q").oninput=renderGrid;
applyLang();
initDB().then(()=>{B.settings(s=>{S=s||{};applySettings();renderGrid();renderCart()});B.products(l=>{products=l;renderGrid();renderCart();if(admin&&$("#pList"))renderPList()})}).catch(e=>{console.error(e);toast("Firebase error: "+e.message)});
</script></body></html>
